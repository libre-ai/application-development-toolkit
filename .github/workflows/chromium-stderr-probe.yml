# TEMPORARY measurement workflow, removed before merge. Captures raw Chromium stderr
# (DEBUG=pw:browser) over repeated runs of the starter suite on the CI runner.
name: Chromium stderr probe (temporary)
'on':
  pull_request:
    paths:
      - '.github/workflows/chromium-stderr-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.ref == 'work/documents-75-adt-fix'
    strategy:
      fail-fast: false
      matrix:
        variant: [blank-1.61.1, app-1.61.1, blank-1.63.0, app-1.63.0, app-1.61.1-serial]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: diagnostic
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout composition tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libre-ai/project-governance
          ref: 2024a4884b314df99be457618be9c3b48a0287f7
          path: tooling
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare sources
        shell: bash
        run: |
          python3 -B tooling/.github/composition/run-composition.py \
            --target application-development-toolkit \
            --revision "${{ github.event.pull_request.head.sha }}" \
            --root "$GITHUB_WORKSPACE/composition" --phase prepare
      - name: Install Bun and Node
        shell: bash
        run: |
          bash tooling/.github/composition/install-toolchains.sh \
            "$GITHUB_WORKSPACE/composition/project-governance/toolchains/bun.json" \
            "$GITHUB_WORKSPACE/composition/project-governance/toolchains/notebook-qualification.json"
      - run: pipx install reuse==6.2.0
      - name: Install frozen composition
        shell: bash
        run: |
          python3 -B tooling/.github/composition/run-composition.py \
            --target application-development-toolkit \
            --revision "${{ github.event.pull_request.head.sha }}" \
            --root "$GITHUB_WORKSPACE/composition" --phase check
      - name: Install browsers
        working-directory: composition/application-development-toolkit/packages/ui
        run: bun x --no-install playwright install --with-deps chromium firefox webkit
      - name: Runner facts
        shell: bash
        run: |
          uname -a; cat /etc/os-release | head -3; nproc; free -m; df -h /dev/shm /tmp | cat
          ulimit -a | head -20
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces 2>&1 || true
          node -v; bun -v
      - name: Build
        working-directory: composition/application-development-toolkit
        run: bun run build
      - name: Minimal launch loop (no test runner)
        working-directory: composition/application-development-toolkit/packages/starter/starter
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/probe"
          PWVER="${VARIANT#*-}"; PWVER="${PWVER%%-*}"
          TARGET="${VARIANT%%-*}"
          if [ "$PWVER" = "1.63.0" ]; then
            mkdir -p /tmp/pw163 && (cd /tmp/pw163 && npm init -y >/dev/null && npm i playwright-core@1.63.0 >/dev/null && node node_modules/playwright-core/cli.js install --with-deps chromium)
            export PW_MODULE=/tmp/pw163/node_modules/playwright-core/index.mjs
          else
            export PW_MODULE="$PWD/node_modules/playwright-core/index.mjs"
            [ -f "$PW_MODULE" ] || export PW_MODULE="$(cd "$GITHUB_WORKSPACE/composition/application-development-toolkit" && node -e 'console.log(require.resolve("playwright-core/index.mjs"))')"
          fi
          echo "module: $PW_MODULE"
          if [ "$TARGET" = "app" ]; then
            HOST=127.0.0.1 PORT=3000 bun src/server/index.ts > "$GITHUB_WORKSPACE/probe/server.log" 2>&1 &
            for _ in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null && break; sleep 0.2; done
            export PROBE_URL=https://127.0.0.1:3000/
          else
            export PROBE_URL=about:blank
          fi
          if [[ "$VARIANT" == *serial ]]; then export PROBE_LANES=1; else export PROBE_LANES=2; fi
          cat > "$GITHUB_WORKSPACE/probe-launch.mjs" <<'JS'
          const { chromium } = await import(process.env.PW_MODULE);
          const url = process.env.PROBE_URL;
          const lanes = Number(process.env.PROBE_LANES);
          const perLane = 30;
          let launches = 0, crashes = 0, gotoErrors = 0;
          async function lane() {
            for (let i = 0; i < perLane; i++) {
              const browser = await chromium.launch({ channel: "chromium" });
              launches++;
              let closedByUs = false;
              browser.on("disconnected", () => { if (!closedByUs) crashes++; });
              try {
                const ctx = await browser.newContext({ ignoreHTTPSErrors: true });
                const page = await ctx.newPage();
                await page.goto(url);
                await new Promise((r) => setTimeout(r, 2500));
              } catch (e) {
                gotoErrors++;
              }
              closedByUs = true;
              await browser.close().catch(() => {});
            }
          }
          await Promise.all(Array.from({ length: lanes }, lane));
          console.log(JSON.stringify({ variant: process.env.VARIANT, version: chromium.name(), launches, unexpectedDisconnects: crashes, gotoErrors }));
          JS
          sed -i 's/^          //' "$GITHUB_WORKSPACE/probe-launch.mjs"
          for r in 1 2 3; do
            DEBUG=pw:browser node "$GITHUB_WORKSPACE/probe-launch.mjs" > "$GITHUB_WORKSPACE/probe/$VARIANT-round-$r.log" 2>&1 || echo "round $r exit $?"
            echo "round $r: $(grep -c 'signal=SIGTRAP' "$GITHUB_WORKSPACE/probe/$VARIANT-round-$r.log") SIGTRAP; $(tail -1 "$GITHUB_WORKSPACE/probe/$VARIANT-round-$r.log" | cut -c1-200)"
          done
      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chromium-stderr-probe-${{ matrix.variant }}
          path: probe/*.log
          retention-days: 3
