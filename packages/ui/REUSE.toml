# REUSE 3.3 manifest of the ui repository (born from the hub, ADR-0020).
version = 1
SPDX-PackageName = "ui"
SPDX-PackageSupplier = "Libre AI <https://github.com/libre-ai>"
SPDX-PackageDownloadLocation = "https://github.com/libre-ai/ui"

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "Apache-2.0"

# Third-party DTCG schema follows its consumer (design §4.5).
[[annotations]]
path = ["third_party/dtcg-format-2025.10/**"]
precedence = "override"
SPDX-FileCopyrightText = "W3C Design Tokens Community Group"
SPDX-License-Identifier = "W3C-20150513"

[[annotations]]
path = ["src/assets/libre-ai-mark.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "LicenseRef-Libre-AI-Brand-1.0"
